[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-auth-switch"
version = "0.1.0"
description = "Switch auth profiles for AI coding agents while keeping app config and history shared."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Lixtt" }
]
keywords = ["codex", "auth", "cli", "ai-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Lixtt/ai-auth-switch"
Repository = "https://github.com/Lixtt/ai-auth-switch.git"

[project.scripts]
ai-auth-switch = "ai_auth_switch.cli:main"

[tool.setuptools.packages.find]
include = ["ai_auth_switch*"]
