[metadata]
name = ai-auth-switch
version = 0.5.0
description = Switch auth profiles for AI coding agents while keeping app config and history shared.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Lixtt
url = https://github.com/Lixtt/ai-auth-switch
project_urls =
    Repository = https://github.com/Lixtt/ai-auth-switch.git
keywords = codex, claude, anthropic, auth, cli, ai-agent
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Topic :: Utilities

[options]
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
include = ai_auth_switch*

[options.entry_points]
console_scripts =
    ai-auth-switch = ai_auth_switch.cli:main
    ais = ai_auth_switch.cli:main
